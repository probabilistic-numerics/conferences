<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProbNum Conferences</title>
  <meta name="description" content="A new website for the ProbNum conference series is on its way. Details of ProbNum 2027 will be announced soon.">
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1c1c1e;
      --muted: #5f6368;
      --accent: #2f5d8a;
      --card: #ffffff;
      --border: #e3e3e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141517;
        --fg: #ececec;
        --muted: #a0a4a8;
        --accent: #7fb0e0;
        --card: #1d1f22;
        --border: #2c2f33;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    main {
      max-width: 560px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 40px;
      text-align: center;
    }
    .eyebrow {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin: 0 0 12px;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      line-height: 1.2;
      margin: 0 0 20px;
    }
    p { margin: 0 0 16px; color: var(--muted); }
    .announce {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--fg);
      font-weight: 500;
    }
    a { color: var(--accent); }
    footer { margin-top: 28px; font-size: 0.85rem; color: var(--muted); }
    @media (max-width: 480px) {
      main { padding: 36px 20px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ProbNum Conferences</p>
    <h1>A new website is on its way</h1>
    <p>We are working on a new home for the ProbNum conference series on probabilistic numerics.</p>
    <p class="announce">Details of the 2027 conference will be announced soon.</p>
    <footer>
      In the meantime, visit <a href="https://www.probabilistic-numerics.org/">probabilistic-numerics.org</a>.
    </footer>
  </main>
</body>
</html>
