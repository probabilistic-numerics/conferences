<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ page.title | default: site.title }}</title>
        <meta name="description" content="{{ page.description | escape }}">
        <meta property="og:image" content="/pn-logo-dark-txtbelow.svg">

        <!-- load Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- same look as the yearly conference pages (see 2027/style.css) -->
        <style>
            .navbar {
                background-color: #28A8A8;
            }

            /* space between the header image and the navbar */
            .header {
                margin-bottom: 1.5rem;
            }

            /* keep the logo a sensible size on wide screens */
            .header .headerImage {
                max-width: 600px;
                margin: 0 auto;
            }

            /* keep anchored headings clear of the sticky navbar */
            main h2, main h3, main h4, main h5 {
                scroll-margin-top: 5rem;
            }

            main h5 {
                margin-top: 1.25rem;
            }
        </style>
    </head>

    <body>

        <div class="container-fluid header">
            <div class="row">
            <img class="headerImage" src="{{ page.header_image }}" alt="ProbNum header" style="width: 100%; height: auto;">
            </div><!-- /.row -->    
        </div><!-- /.container -->

        <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
            <div class="container">
                <a class="navbar-brand" href="/">ProbNum Conferences</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <!-- <ul class="navbar-nav">
                    </ul> -->
                </div>
            </div>
        </nav>

        <main class="container mt-5 mb-5">
            {{ content }}
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
